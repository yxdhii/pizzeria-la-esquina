<!doctype html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Panel Cajero | La Esquina</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/navbar.css}">
    <link rel="stylesheet" th:href="@{/css/cajero.css}">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
</head>

<body>

<div th:replace="~{fragments/navbar :: navbar}"></div>

<main class="cashier-page">

    <section class="cashier-hero">

        <div class="cashier-content">

            <div class="cashier-title">
                <span class="cashier-icon">
                    <i class="bi bi-calculator"></i>
                </span>

                <div>
                    <h1>Panel del Cajero</h1>
                    <p>Gestiona los pedidos pendientes de cobro y los comprobantes emitidos.</p>
                </div>
            </div>

            <div class="cashier-card">
                <div class="card-icon">
                    <i class="bi bi-clipboard-check"></i>
                </div>

                <div class="cashier-card-info">
                    <h3>Pedidos por cobrar</h3>
                    <h2 th:text="${porCobrar}">0</h2>
                    <span>No hay pedidos pendientes de cobro</span>
                </div>
            </div>

            <div class="cashier-actions">
                <a th:href="@{/cajero/pedidos}" class="btn-cashier-primary">
                    <i class="bi bi-card-list"></i>
                    Ver pedidos por cobrar
                    <i class="bi bi-arrow-right"></i>
                </a>

                <a th:href="@{/cajero/facturas}" class="btn-cashier-secondary">
                    <i class="bi bi-file-earmark-text"></i>
                    Ver comprobantes emitidos
                    <i class="bi bi-arrow-right"></i>
                </a>
            </div>

        </div>

        <div class="cashier-image">
            <img th:src="@{/img/img-14.png}" alt="Cajero">
        </div>

    </section>

</main>

<div th:replace="~{fragments/footer :: footer}"></div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
