<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Detalle comprobante | La Esquina</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/navbar.css}">
    <link rel="stylesheet" th:href="@{/css/cajero.css}">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
</head>

<body>

<div th:replace="~{fragments/navbar :: navbar}"></div>

<main class="receipt-page">

    <section class="receipt-card">

        <div class="receipt-header">
            <div>
                <span class="receipt-label">Comprobante emitido</span>
                <h1>Comprobante #<span th:text="${factura.idFactura}">1</span></h1>
                <p>Detalle del pedido cobrado.</p>
            </div>

            <button onclick="window.print()" class="btn-print">
                <i class="bi bi-printer"></i>
                Imprimir
            </button>
        </div>

        <div class="receipt-info">
            <p><strong>Fecha:</strong> <span th:text="${#temporals.format(factura.fechaEmision, 'dd/MM/yyyy HH:mm')}"></span></p>
            <p><strong>Cliente:</strong> <span th:text="${factura.pedido.cliente.nombreCompleto}"></span></p>
            <p><strong>Pedido:</strong> #<span th:text="${factura.pedido.idPedido}"></span></p>
            <p><strong>Método de pago:</strong> <span th:text="${factura.metodoPago}"></span></p>
        </div>

        <table class="table receipt-table">
            <thead>
            <tr>
                <th>Producto</th>
                <th>Cantidad</th>
                <th>Notas</th>
                <th>Subtotal</th>
            </tr>
            </thead>

            <tbody>
            <tr th:each="d : ${factura.pedido.detalles}">
                <td th:text="${d.producto.nombreProducto}">Pizza</td>
                <td th:text="${d.cantidad}">1</td>
                <td th:text="${d.notas != null and !d.notas.isEmpty()} ? ${d.notas} : '-'">-</td>
                <td th:text="'S/ ' + ${#numbers.formatDecimal(d.subtotal,1,2)}">S/ 0.00</td>
            </tr>
            </tbody>
        </table>

        <div class="receipt-total">
            <span>Total</span>
            <strong th:text="'S/ ' + ${#numbers.formatDecimal(factura.montoTotal,1,2)}">S/ 0.00</strong>
        </div>

        <a th:href="@{/cajero/facturas}" class="btn-back-receipt">
            <i class="bi bi-arrow-left"></i>
            Volver
        </a>

    </section>

</main>

<div th:replace="~{fragments/footer :: footer}"></div>

</body>
</html>
