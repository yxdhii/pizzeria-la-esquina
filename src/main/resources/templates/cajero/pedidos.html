<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Por cobrar | La Esquina</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/navbar.css}">
    <link rel="stylesheet" th:href="@{/css/cajero.css}">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
</head>

<body>

<div th:replace="~{fragments/navbar :: navbar}"></div>

<main class="cashier-orders-page">

    <section class="cashier-orders-hero">

        <div class="cashier-orders-title">
            <span class="cashier-orders-icon">
                <i class="bi bi-clipboard-check"></i>
            </span>

            <div>
                <h1>Pedidos listos por cobrar</h1>
                <p>Gestiona los pedidos pendientes de cobro de manera rápida y sencilla.</p>
            </div>
        </div>

        <img th:src="@{/img/img-15.png}" alt="Cajero">

    </section>

    <section class="cashier-orders-card">

        <table class="table cashier-orders-table">
            <thead>
            <tr>
                <th>#</th>
                <th>Cliente</th>
                <th>Tipo</th>
                <th>Total (S/)</th>
                <th>Método de pago</th>
                <th class="text-center">Acción</th>
            </tr>
            </thead>

            <tbody>
            <tr th:each="p : ${pedidos}">
                <td>
                    <strong class="order-id" th:text="'#' + ${p.idPedido}">#1</strong>
                </td>

                <td>
                    <div class="client-cell">
                        <div class="client-avatar"
                             th:text="${#strings.substring(p.cliente.nombreCompleto,0,1)}">
                            A
                        </div>

                        <strong th:text="${p.cliente.nombreCompleto}">
                            Cliente
                        </strong>
                    </div>
                </td>

                <td>
                    <span class="type-badge" th:text="${p.tipoPedido}">
                        SALON
                    </span>
                </td>

                <td>
                    <strong class="cash-total"
                            th:text="'S/ ' + ${#numbers.formatDecimal(p.total,1,2)}">
                        S/ 0.00
                    </strong>
                </td>

                <td>
                    <form th:action="@{/cajero/pedidos/{id}/cobrar(id=${p.idPedido})}"
                          method="post"
                          class="cash-form">

                        <select name="metodoPago" required>
                            <option value="EFECTIVO">Efectivo</option>
                            <option value="TARJETA">Tarjeta</option>
                            <option value="APP">App</option>
                        </select>

                        <button class="btn-charge" type="submit">
                            <i class="bi bi-cash-coin"></i>
                            Cobrar
                        </button>

                    </form>
                </td>

                <td class="text-center">
                    <span class="status-ready">
                        <i class="bi bi-check-circle-fill"></i>
                        Listo
                    </span>
                </td>
            </tr>

            <tr th:if="${pedidos.isEmpty()}">
                <td colspan="6">
                    <div class="empty-cashier">
                        <div class="empty-cashier-icon">
                            <i class="bi bi-inbox"></i>
                        </div>

                        <h3>No hay pedidos pendientes de cobro</h3>
                        <p>No tienes pedidos listos para cobrar en este momento.</p>
                    </div>
                </td>
            </tr>
            </tbody>
        </table>

    </section>

</main>

<div th:replace="~{fragments/footer :: footer}"></div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
