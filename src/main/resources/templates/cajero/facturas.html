<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Comprobantes | La Esquina</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/navbar.css}">
    <link rel="stylesheet" th:href="@{/css/cajero.css}">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
</head>

<body>

<div th:replace="~{fragments/navbar :: navbar}"></div>

<main class="cashier-orders-page">

    <section class="cashier-orders-hero">

        <div class="cashier-orders-title">
            <span class="cashier-orders-icon">
                <i class="bi bi-file-earmark-text"></i>
            </span>

            <div>
                <h1>Comprobantes emitidos</h1>
                <p>Consulta y revisa todos los comprobantes emitidos por los pedidos cobrados.</p>
            </div>
        </div>

        <img th:src="@{/img/img-15.png}" alt="Cajero">

    </section>

    <section class="cashier-orders-card">

        <table class="table cashier-orders-table">
            <thead>
            <tr>
                <th>N°</th>
                <th>Fecha</th>
                <th>Pedido</th>
                <th>Cliente</th>
                <th>Método</th>
                <th>Total (S/)</th>
                <th>Acciones</th>
            </tr>
            </thead>

            <tbody>
            <tr th:each="f : ${facturas}">
                <td>
                    <strong class="order-id" th:text="'#' + ${f.idFactura}">#1</strong>
                </td>

                <td th:text="${#temporals.format(f.fechaEmision, 'dd/MM/yyyy HH:mm')}">
                    27/06/2026 15:30
                </td>

                <td>
                    <span class="mesa-badge" th:text="'Pedido #' + ${f.pedido.idPedido}">
                        Pedido #1
                    </span>
                </td>

                <td>
                    <div class="client-cell">
                        <div class="client-avatar"
                             th:text="${#strings.substring(f.pedido.cliente.nombreCompleto,0,1)}">
                            A
                        </div>

                        <strong th:text="${f.pedido.cliente.nombreCompleto}">
                            Cliente
                        </strong>
                    </div>
                </td>

                <td>
                    <span class="type-badge" th:text="${f.metodoPago}">
                        EFECTIVO
                    </span>
                </td>

                <td>
                    <strong class="cash-total"
                            th:text="'S/ ' + ${#numbers.formatDecimal(f.montoTotal,1,2)}">
                        S/ 0.00
                    </strong>
                </td>
                <td>
                    <a th:href="@{/cajero/facturas/{id}(id=${f.idFactura})}"
       class="btn btn-sm btn-outline-primary">
       <i class="bi bi-eye"></i> Ver

                    </a>
                </td>
            </tr>

            <tr th:if="${facturas.isEmpty()}">
                <td colspan="7">
                    <div class="empty-cashier">
                        <div class="empty-cashier-icon">
                            <i class="bi bi-inbox"></i>
                        </div>

                        <h3>No hay comprobantes emitidos</h3>
                        <p>Aún no se han emitido comprobantes.</p>
                    </div>
                </td>
            </tr>
            </tbody>
        </table>

    </section>

</main>

<div th:replace="~{fragments/footer :: footer}"></div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
