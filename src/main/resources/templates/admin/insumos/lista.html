<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Insumos | La Esquina</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/navbar.css}">
    <link rel="stylesheet" th:href="@{/css/insumos.css}">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
</head>

<body>

<div th:replace="~{fragments/navbar :: navbar}"></div>

<main class="insumos-page">

    <section class="insumos-hero">
        <div>
            <span class="module-label">Módulo administrativo</span>
            <h1>Insumos</h1>
            <p>Gestiona los insumos necesarios para la preparación de pizzas y otros productos.</p>
        </div>

        <img th:src="@{/img/img-6.png}" alt="Insumos">

        <a th:href="@{/admin/insumos/nuevo}" class="btn-new">
            <i class="bi bi-plus-circle-fill"></i>
            Nuevo insumo
        </a>
    </section>

    <section class="insumos-card">

        <table class="table insumos-table">
            <thead>
            <tr>
                <th>Nombre</th>
                <th>Unidad</th>
                <th>Precio compra</th>
                <th>Proveedor</th>
                <th class="text-center">Acciones</th>
            </tr>
            </thead>

            <tbody>
            <tr th:each="i : ${insumos}">
                <td>
                    <div class="insumo-cell">
                        <div class="insumo-icon">
                            <i class="bi bi-box-seam"></i>
                        </div>
                        <strong th:text="${i.nombreInsumo}">Queso mozzarella</strong>
                    </div>
                </td>

                <td>
                    <span class="unit-badge" th:text="${i.unidadMedida}">kg</span>
                </td>

                <td>
                    <span class="price-badge">
                        S/ <span th:text="${#numbers.formatDecimal(i.precioCompra,1,2)}">18.00</span>
                    </span>
                </td>

                <td>
                    <span class="provider-chip">
                        <i class="bi bi-building"></i>
                        <span th:text="${i.proveedor != null} ? ${i.proveedor.nombreProveedor} : '-'">
                            Distribuidora Lacteos SJL
                        </span>
                    </span>
                </td>

                <td class="text-center">
                    <a th:href="@{/admin/insumos/{id}/eliminar(id=${i.idInsumo})}"
                       class="btn-action btn-delete btn-confirm-delete">
                        <i class="bi bi-trash3"></i>
                        Eliminar
                    </a>
                </td>
            </tr>
            </tbody>
        </table>

        <div class="inventory-note">
            <i class="bi bi-info-circle-fill"></i>
            <span>
                Nota: el stock se gestiona en la pantalla
                <a th:href="@{/admin/inventario}">Inventario</a>.
            </span>
        </div>

    </section>

</main>

<div th:replace="~{fragments/footer :: footer}"></div>
<div th:replace="~{fragments/alerts :: alerts}"></div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
