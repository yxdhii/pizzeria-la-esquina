<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Insumo - La Esquina</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/navbar.css}">
    <link rel="stylesheet" th:href="@{/css/insumos.css}">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
</head>

<body>

<div th:replace="~{fragments/navbar :: navbar}"></div>

<main class="insumo-form-page">

    <section class="insumo-form-card">

        <div class="insumo-form-left">

            <span class="module-label">Módulo administrativo</span>

            <h1>Nuevo insumo</h1>

            <p class="form-description">
                Registra un nuevo insumo y su información inicial de inventario.
            </p>

            <form th:action="@{/admin/insumos/guardar}" th:object="${insumo}" method="post">

                <div class="form-grid">

                    <div class="input-box">
                        <label>Nombre</label>
                        <div class="input-icon">
                            <i class="bi bi-box-seam"></i>
                            <input type="text" th:field="*{nombreInsumo}" placeholder="Ej. Queso mozzarella" required>
                        </div>
                    </div>

                    <div class="input-box">
                        <label>Unidad de medida</label>
                        <div class="input-icon">
                            <i class="bi bi-rulers"></i>
                            <input type="text" th:field="*{unidadMedida}" placeholder="kg, litro, unidad" required>
                        </div>
                    </div>

                    <div class="input-box">
                        <label>Precio de compra (S/)</label>
                        <div class="input-icon">
                            <i class="bi bi-currency-dollar"></i>
                            <input type="number" step="0.1" th:field="*{precioCompra}" placeholder="Ej. 18.00" required>
                        </div>
                    </div>

                    <div class="input-box">
                        <label>Proveedor</label>
                        <div class="input-icon">
                            <i class="bi bi-building"></i>
                            <select th:field="*{proveedor}">
                                <option th:each="p : ${proveedores}"
                                        th:value="${p.idProveedor}"
                                        th:text="${p.nombreProveedor}">
                                </option>
                            </select>
                        </div>
                    </div>

                </div>

                <div class="inventory-section">
                    <div class="inventory-title">
                        <i class="bi bi-clipboard-check"></i>
                        <span>Datos iniciales de inventario</span>
                        <small>(se crea automáticamente)</small>
                    </div>

                    <div class="form-grid">

                        <div class="input-box">
                            <label>Stock inicial</label>
                            <div class="input-icon">
                                <i class="bi bi-box"></i>
                                <input type="number" step="0.1" name="stockInicial" value="0" required>
                            </div>
                        </div>

                        <div class="input-box">
                            <label>Stock mínimo</label>
                            <div class="input-icon">
                                <i class="bi bi-exclamation-triangle"></i>
                                <input type="number" step="0.1" name="stockMinimo" value="0" required>
                            </div>
                        </div>

                    </div>
                </div>

                <div class="form-actions">
                    <button type="submit" class="btn-save btn-confirm-save">
                        <i class="bi bi-check-circle-fill"></i>
                        Guardar
                    </button>

                    <a th:href="@{/admin/insumos}" class="btn-cancel">
                        <i class="bi bi-x-lg"></i>
                        Cancelar
                    </a>
                </div>

            </form>

        </div>

        <aside class="insumo-form-right">
            <img th:src="@{/img/img-6.png}" alt="Insumos">
        </aside>

    </section>

</main>

<div th:replace="~{fragments/footer :: footer}"></div>
<div th:replace="~{fragments/alerts :: alerts}"></div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
