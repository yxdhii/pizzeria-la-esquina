<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Mesa - La esquina</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/navbar.css}">
    <link rel="stylesheet" th:href="@{/css/mesas.css}">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
</head>

<body>

<div th:replace="~{fragments/navbar :: navbar}"></div>

<main class="mesas-page">

    <section class="mesas-header">
        <div>
            <span class="module-label">Módulo administrativo</span>
            <h1>Mesas</h1>
            <p>Administra las mesas del salón, su capacidad y estado disponible para los clientes.</p>
        </div>

        <img th:src="@{/img/img-1.png}" alt="Mesas">

        <a th:href="@{/admin/mesas/nuevo}" class="btn-new">
            <i class="bi bi-plus-circle-fill"></i>
            Nueva mesa
        </a>
    </section>

    <section class="mesas-grid">
        <article class="mesa-card"
                 th:each="m : ${mesas}"
                 th:classappend="${m.estado.name() == 'DISPONIBLE'} ? ' mesa-disponible' : (${m.estado.name() == 'OCUPADA'} ? ' mesa-ocupada' : ' mesa-reservada')">

            <div class="mesa-number" th:text="${m.numero}">1</div>

            <img class="mesa-img" th:src="@{/img/img-3.png}" alt="Mesa">

            <h3>
                Mesa <span th:text="${m.numero}">1</span>
            </h3>

            <p>
                Capacidad:
                <strong th:text="${m.capacidad}">2</strong>
                personas
            </p>

            <span class="mesa-status">
                <i class="bi bi-circle-fill"></i>
                <span th:text="${m.estado}">DISPONIBLE</span>
            </span>

            <div class="mesa-actions">
                <a th:href="@{/admin/mesas/{id}/editar(id=${m.idMesa})}" class="btn-action btn-edit">
                    <i class="bi bi-pencil-square"></i>
                    Editar
                </a>

                <a th:href="@{/admin/mesas/{id}/eliminar(id=${m.idMesa})}"
                   class="btn-action btn-delete btn-confirm-delete">
                    <i class="bi bi-trash3"></i>
                    Eliminar
                </a>
            </div>

        </article>
    </section>

</main>

<div th:replace="~{fragments/footer :: footer}"></div>
<div th:replace="~{fragments/alerts :: alerts}"></div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
