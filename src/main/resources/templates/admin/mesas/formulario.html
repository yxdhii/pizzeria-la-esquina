<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Mesa - La Esquina</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/navbar.css}">
    <link rel="stylesheet" th:href="@{/css/mesas.css}">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
</head>

<body>

<div th:replace="~{fragments/navbar :: navbar}"></div>

<main class="mesa-form-page">

    <section class="mesa-form-card">

        <div class="mesa-form-left">

            <span class="form-label-title">Módulo administrativo</span>

            <h1 th:text="${mesa.idMesa} == null ? 'Nueva mesa' : 'Editar mesa'">
                Nueva mesa
            </h1>

            <p class="form-description">
                Registra una nueva mesa del salón y asigna su número, capacidad y estado.
            </p>

            <form th:action="@{/admin/mesas/guardar}" th:object="${mesa}" method="post">

                <input type="hidden" th:field="*{idMesa}">

                <div class="input-box">
                    <label>Número de mesa</label>
                    <div class="input-icon">
                        <i class="bi bi-layout-text-window"></i>
                        <input type="number" th:field="*{numero}" placeholder="Ej: 1, 2, 3..." required>
                    </div>
                </div>

                <div class="input-box">
                    <label>Capacidad</label>
                    <div class="input-icon">
                        <i class="bi bi-people"></i>
                        <input type="number" th:field="*{capacidad}" placeholder="Ej: 2, 4, 6..." required>
                    </div>
                </div>

                <div class="input-box">
                    <label>Estado</label>
                    <div class="input-icon">
                        <i class="bi bi-check-circle"></i>
                        <select th:field="*{estado}">
                            <option value="DISPONIBLE">Disponible</option>
                            <option value="OCUPADA">Ocupada</option>
                            <option value="RESERVADA">Reservada</option>
                        </select>
                    </div>
                </div>

                <button type="submit" class="btn-save btn-confirm-save">
                    <i class="bi bi-check-circle-fill"></i>
                    Guardar mesa
                </button>

                <a th:href="@{/admin/mesas}" class="btn-cancel">
                    <i class="bi bi-x-lg"></i>
                    Cancelar
                </a>

            </form>

        </div>

        <aside class="mesa-form-right">

            <img th:src="@{/img/img-3.png}" alt="Mesa">

            <div class="info-box">
                <div class="info-icon">
                    <i class="bi bi-info-circle"></i>
                </div>

                <div>
                    <h4>Información importante</h4>
                    <p>El número de mesa debe ser único.</p>
                    <p>La capacidad indica el número máximo de personas que pueden sentarse.</p>
                </div>
            </div>

        </aside>

    </section>

</main>

<div th:replace="~{fragments/footer :: footer}"></div>
<div th:replace="~{fragments/alerts :: alerts}"></div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
