<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Inventario | La Esquina</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/navbar.css}">
    <link rel="stylesheet" th:href="@{/css/inventario.css}">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
</head>

<body>

<div th:replace="~{fragments/navbar :: navbar}"></div>

<main class="inventario-page">

    <section class="inventario-hero">
        <div>
            <span class="module-label">Módulo administrativo</span>
            <h1>Inventario de insumos</h1>
            <p>Controla el stock actual de cada insumo y registra entradas o salidas para mantener el inventario actualizado.</p>
        </div>

        <img th:src="@{/img/img-6.png}" alt="Inventario de insumos">
    </section>

    <section class="inventario-card">

        <table class="table inventario-table">
            <thead>
            <tr>
                <th>Insumo</th>
                <th>Stock actual</th>
                <th>Stock mínimo</th>
                <th>Estado</th>
                <th>Entrada</th>
                <th>Salida</th>
            </tr>
            </thead>

            <tbody>
            <tr th:each="inv : ${inventarios}" th:classappend="${inv.stockBajo} ? ' stock-low' : ''">

                <td>
                    <div class="insumo-cell">
                        <div class="insumo-icon">
                            <i class="bi bi-box-seam"></i>
                        </div>

                        <strong>
                            <span th:text="${inv.insumo.nombreInsumo}">Queso mozzarella</span>
                            <small th:text="'(' + ${inv.insumo.unidadMedida} + ')'">(kg)</small>
                        </strong>
                    </div>
                </td>

                <td>
                    <span class="stock-current" th:text="${inv.stockActual}">20.0</span>
                </td>

                <td>
                    <span class="stock-min" th:text="${inv.stockMinimo}">5.0</span>
                </td>

                <td>
                    <span class="status-badge"
                          th:classappend="${inv.stockBajo} ? ' status-low' : ' status-ok'">
                        <i class="bi bi-circle-fill"></i>
                        <span th:text="${inv.stockBajo} ? 'Stock bajo' : 'OK'">OK</span>
                    </span>
                </td>

                <td>
                    <form th:action="@{/admin/inventario/{id}/entrada(id=${inv.insumo.idInsumo})}"
                          method="post"
                          class="movement-form inventory-entry-form ">

                        <input type="number"
                               step="0.1"
                               name="cantidad"
                               required>

                        <button class="btn-entry" type="submit">
                            <i class="bi bi-plus-lg"></i>
                            Entrada
                        </button>
                    </form>
                </td>

                <td>
                    <form th:action="@{/admin/inventario/{id}/salida(id=${inv.insumo.idInsumo})}"
                          method="post"
                          class="movement-form inventory-exit-form">

                        <input type="number"
                               step="0.1"
                               name="cantidad"
                               required>

                        <button class="btn-exit" type="submit">
                            <i class="bi bi-dash-lg"></i>
                            Salida
                        </button>
                    </form>
                </td>

            </tr>
            </tbody>
        </table>

    </section>

</main>

<div th:replace="~{fragments/footer :: footer}"></div>
<div th:replace="~{fragments/alerts :: alerts}"></div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
