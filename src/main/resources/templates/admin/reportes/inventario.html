<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Reporte de inventario | La Esquina</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/navbar.css}">
    <link rel="stylesheet" th:href="@{/css/reportes.css}">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
</head>

<body>

<div th:replace="~{fragments/navbar :: navbar}"></div>

<main class="report-page">

    <section class="report-hero">
        <div>
            <span class="module-label">Módulo administrativo</span>

            <h1>Insumos en stock mínimo o por debajo</h1>

            <p>
                Revisa los insumos que necesitan reposición para evitar quiebres de stock.
            </p>

            <a th:href="@{/admin/reportes/ventas}" class="btn-back">
                <i class="bi bi-arrow-left"></i>
                Volver a ventas
            </a>
        </div>

        <img th:src="@{/img/img-9.png}" alt="Reporte de inventario">
    </section>

    <section class="report-card">

        <table class="table report-table">
            <thead>
            <tr>
                <th><i class="bi bi-bag"></i> Insumo</th>
                <th><i class="bi bi-bar-chart"></i> Stock actual</th>
                <th><i class="bi bi-shield-exclamation"></i> Stock mínimo</th>
            </tr>
            </thead>

            <tbody>
            <tr th:each="inv : ${inventarios}" class="alert-row">
                <td>
                    <div class="report-item">
                        <div class="report-icon">
                            <i class="bi bi-exclamation-triangle"></i>
                        </div>

                        <strong th:text="${inv.insumo.nombreInsumo}">
                            Queso mozzarella
                        </strong>
                    </div>
                </td>

                <td>
                    <span class="stock-danger" th:text="${inv.stockActual}">
                        0
                    </span>
                </td>

                <td>
                    <span class="stock-minimum" th:text="${inv.stockMinimo}">
                        0
                    </span>
                </td>
            </tr>

            <tr th:if="${inventarios.isEmpty()}">
                <td colspan="3">
                    <div class="empty-state">
                        <img th:src="@{/img/img-10.png}" alt="Sin alertas">
                        <p>No hay alertas de stock 🎉</p>
                        <span>¡Excelente! Todos los insumos están por encima del stock mínimo.</span>
                    </div>
                </td>
            </tr>
            </tbody>
        </table>

    </section>

</main>

<div th:replace="~{fragments/footer :: footer}"></div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
