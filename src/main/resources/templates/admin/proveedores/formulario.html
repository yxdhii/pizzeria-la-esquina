<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <title>Proveedor | La Esquina</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <link rel="stylesheet" th:href="@{/css/navbar.css}">
    <link rel="stylesheet" th:href="@{/css/proveedores.css}">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
</head>

<body>

<div th:replace="~{fragments/navbar :: navbar}"></div>

<main class="proveedor-form-page">

    <section class="proveedor-form-card">

        <div class="form-left">

            <span class="module-label">Módulo administrativo</span>

            <h1 th:text="${proveedor.idProveedor} == null ? 'Nuevo proveedor' : 'Editar proveedor'">
                Nuevo proveedor
            </h1>

            <p>
                Registra la información del proveedor para mantener actualizado
                el abastecimiento de ingredientes e insumos.
            </p>

            <div class="form-image">
                <img th:src="@{/img/img-5.png}" alt="Proveedor">
            </div>

            <div class="info-box">
                <div class="info-icon">
                    <i class="bi bi-info-circle"></i>
                </div>

                <div>
                    <h4>Información importante</h4>
                    <p>
                        Mantén actualizados los datos de contacto para evitar
                        retrasos en el abastecimiento.
                    </p>
                </div>
            </div>

        </div>

        <div class="form-right">

            <form th:action="@{/admin/proveedores/guardar}"
                  th:object="${proveedor}"
                  method="post">

                <input type="hidden" th:field="*{idProveedor}">

                <div class="input-box">
                    <label>Nombre del proveedor</label>
                    <div class="input-icon">
                        <i class="bi bi-shop"></i>
                        <input type="text"
                               th:field="*{nombreProveedor}"
                               placeholder="Ej. Distribuidora Andina"
                               required>
                    </div>
                </div>

                <div class="input-box">
                    <label>Contacto</label>
                    <div class="input-icon">
                        <i class="bi bi-telephone"></i>
                        <input type="text"
                               th:field="*{contacto}"
                               placeholder="Ej. 987654321">
                    </div>
                </div>

                <div class="input-box">
                    <label>Productos suministrados</label>
                    <div class="textarea-icon">
                        <i class="bi bi-box-seam"></i>
                        <textarea th:field="*{productosSuministrados}"
                                  rows="4"
                                  placeholder="Ej. Queso mozzarella, salsa de tomate, jamón..."></textarea>
                    </div>
                </div>

                <button type="submit" class="btn-save btn-confirm-save">
                    <i class="bi bi-check-circle-fill"></i>
                    Guardar proveedor
                </button>

                <a th:href="@{/admin/proveedores}" class="btn-cancel">
                    <i class="bi bi-x-lg"></i>
                    Cancelar
                </a>

            </form>

        </div>

    </section>

</main>

<div th:replace="~{fragments/footer :: footer}"></div>
<div th:replace="~{fragments/alerts :: alerts}"></div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
