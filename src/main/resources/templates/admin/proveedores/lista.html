<!DOCTYPE html>
<html lang="es"
      xmlns:th="http://www.thymeleaf.org">
<head>

    <meta charset="UTF-8">
    <title>Proveedores | La Esquina</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <link rel="stylesheet" th:href="@{/css/navbar.css}">
    <link rel="stylesheet" th:href="@{/css/proveedores.css}">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

</head>

<body>

<div th:replace="~{fragments/navbar :: navbar}"></div>

<main class="module-page">

    <!-- HERO -->
    <section class="module-hero">

        <div class="hero-info">

            <span class="module-label">
                Módulo administrativo
            </span>

            <h1>Proveedores</h1>

            <p>
                Administra la información de los proveedores,
                contactos y productos suministrados para mantener
                el abastecimiento de la pizzería.
            </p>

        </div>

        <div class="hero-image">

            <img th:src="@{/img/img-5.png}"
                 alt="Proveedores">

        </div>

        <div>

            <a th:href="@{/admin/proveedores/nuevo}"
               class="btn-new">

                <i class="bi bi-plus-circle-fill"></i>
                Nuevo proveedor

            </a>

        </div>

    </section>


    <!-- TABLA -->
    <section class="table-card">

        <div class="search-box">

            <i class="bi bi-search"></i>

            <input type="text"
                   placeholder="Buscar proveedor...">

        </div>


        <table class="table app-table align-middle">

            <thead>

            <tr>

                <th>Proveedor</th>
                <th>Contacto</th>
                <th>Productos</th>
                <th class="text-center">Acciones</th>

            </tr>

            </thead>

            <tbody>

            <tr th:each="p : ${proveedores}">

                <td>

                    <div class="client-cell">

                        <div class="client-avatar"
                             th:text="${#strings.substring(p.nombreProveedor,0,1)}">
                            P
                        </div>

                        <strong th:text="${p.nombreProveedor}">
                            Distribuidora Lácteos
                        </strong>

                    </div>

                </td>

                <td>

                    <span class="contact-chip">

                        <i class="bi bi-telephone-fill"></i>

                        <span th:text="${p.contacto}">
                            987654321
                        </span>

                    </span>

                </td>

                <td>

                    <span class="products-chip"
                          th:text="${p.productosSuministrados}">
                        Queso, Salsa, Jamón
                    </span>

                </td>

                <td class="text-center">

                    <a th:href="@{/admin/proveedores/{id}/editar(id=${p.idProveedor})}"
                       class="btn-action btn-edit">

                        <i class="bi bi-pencil-square"></i>
                        Editar

                    </a>

                    <a th:href="@{/admin/proveedores/{id}/eliminar(id=${p.idProveedor})}"
                       class="btn-action btn-delete btn-confirm-delete">               
                        <i class="bi bi-trash3"></i>
                        Eliminar

                    </a>

                </td>

            </tr>

            </tbody>

        </table>

    </section>

</main>

<div th:replace="~{fragments/footer :: footer}"></div>
<div th:replace="~{fragments/alerts :: alerts}"></div>

</body>
</html>
