<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Productos - La Esquina</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/navbar.css}">
    <link rel="stylesheet" th:href="@{/css/productos.css}">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
</head>

<body>

<div th:replace="~{fragments/navbar :: navbar}"></div>

<main class="productos-page">

    <section class="productos-hero">
        <div>
            <span class="module-label">Módulo administrativo</span>
            <h1>Productos</h1>
            <p>Gestiona los productos que ofrece la pizzería, sus precios y disponibilidad para la venta.</p>
        </div>

        <img th:src="@{/img/img-4.png}" alt="Productos">

        <a th:href="@{/admin/productos/nuevo}" class="btn-new">
            <i class="bi bi-plus-circle-fill"></i>
            Nuevo producto
        </a>
    </section>

    <section class="productos-card">

        <table class="table productos-table">
            <thead>
            <tr>
                <th>Producto</th>
                <th>Tipo</th>
                <th>Precio</th>
                <th>Disponible</th>
                <th class="text-center">Acciones</th>
            </tr>
            </thead>

            <tbody>
            <tr th:each="p : ${productos}">
                <td>
                    <div class="product-cell">
                        <div class="product-icon"
                             th:classappend="${p.tipoProducto.name() == 'PIZZA'} ? ' icon-pizza' :
                                            (${p.tipoProducto.name() == 'BEBIDA'} ? ' icon-bebida' : ' icon-complemento')">
                            <i th:classappend="${p.tipoProducto.name() == 'PIZZA'} ? ' bi-pie-chart' :
                                               (${p.tipoProducto.name() == 'BEBIDA'} ? ' bi-cup-straw' : ' bi-basket')"
                               class="bi"></i>
                        </div>

                        <strong th:text="${p.nombreProducto}">
                            Pizza Margarita
                        </strong>
                    </div>
                </td>

                <td>
                    <span class="type-badge"
                          th:classappend="${p.tipoProducto.name() == 'PIZZA'} ? ' type-pizza' :
                                         (${p.tipoProducto.name() == 'BEBIDA'} ? ' type-bebida' : ' type-complemento')"
                          th:text="${p.tipoProducto}">
                        PIZZA
                    </span>
                </td>

                <td>
                    <span class="price">
                        S/ <span th:text="${#numbers.formatDecimal(p.precio,1,2)}">28.00</span>
                    </span>
                </td>

                <td>
                    <span class="available-badge"
                          th:classappend="${p.disponibilidad} ? ' available-yes' : ' available-no'">
                        <i class="bi bi-circle-fill"></i>
                        <span th:text="${p.disponibilidad} ? 'Sí' : 'No'">Sí</span>
                    </span>
                </td>

                <td class="text-center">
                    <a th:href="@{/admin/productos/{id}/editar(id=${p.idProducto})}"
                       class="btn-action btn-edit">
                        <i class="bi bi-pencil-square"></i>
                        Editar
                    </a>

                    <a th:href="@{/admin/productos/{id}/eliminar(id=${p.idProducto})}"
                       class="btn-action btn-delete btn-confirm-delete">
                        <i class="bi bi-trash3"></i>
                        Eliminar
                    </a>
                </td>
            </tr>
            </tbody>
        </table>

    </section>

</main>

<div th:replace="~{fragments/footer :: footer}"></div>
<div th:replace="~{fragments/alerts :: alerts}"></div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
