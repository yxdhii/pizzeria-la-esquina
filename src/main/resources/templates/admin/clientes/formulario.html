<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Cliente - La Esquina</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/navbar.css}">
    <link rel="stylesheet" th:href="@{/css/clientes.css}">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
</head>


<body>
<div th:replace="~{fragments/navbar :: navbar}"></div>


<main class="form-page">

    <section class="form-card">

        <div class="form-left">

            <span class="form-label-title">Módulo administrativo</span>

            <h1 th:text="${cliente.idCliente} == null ? 'Nuevo cliente' : 'Editar cliente'">
                Nuevo cliente
            </h1>

            <p class="form-description">
                Completa los datos del cliente para registrarlo correctamente en el sistema.
            </p>

            <form th:action="@{/admin/clientes/guardar}" th:object="${cliente}" method="post">

                <input type="hidden" th:field="*{idCliente}">

                <div class="form-row">
                    <div class="input-box">
                        <label>Nombre</label>
                        <div class="input-icon">
                            <i class="bi bi-person"></i>
                            <input type="text" th:field="*{nombre}" placeholder="Ingrese el nombre" required>
                        </div>
                    </div>

                    <div class="input-box">
                        <label>Apellido</label>
                        <div class="input-icon">
                            <i class="bi bi-person"></i>
                            <input type="text" th:field="*{apellido}" placeholder="Ingrese el apellido">
                        </div>
                    </div>
                </div>

                <div class="input-box">
                    <label>Teléfono</label>
                    <div class="input-icon">
                        <i class="bi bi-telephone"></i>
                        <input type="text" th:field="*{telefono}" placeholder="Ingrese el teléfono">
                    </div>
                </div>

                <div class="input-box">
                    <label>Correo</label>
                    <div class="input-icon">
                        <i class="bi bi-envelope"></i>
                        <input type="email" th:field="*{correo}" placeholder="Ingrese el correo electrónico">
                    </div>
                </div>

                <div class="input-box">
                    <label>Dirección</label>
                    <div class="input-icon">
                        <i class="bi bi-geo-alt"></i>
                        <input type="text" th:field="*{direccion}" placeholder="Ingrese la dirección">
                    </div>
                </div>

                <div class="input-box">
                    <label>Tipo de cliente</label>
                    <div class="input-icon">
                        <i class="bi bi-people"></i>
                        <select th:field="*{tipoCliente}" required>
                            <option value="SALON">Salón</option>
                            <option value="LLEVAR">Para llevar</option>
                        </select>
                    </div>
                </div>

                <button type="submit" class="btn-save btn-confirm-save">
                    <i class="bi bi-check-circle-fill"></i>
                    Guardar
                </button>

                <a th:href="@{/admin/clientes}" class="btn-cancel">
                    <i class="bi bi-x-lg"></i>
                    Cancelar
                </a>

            </form>

        </div>

        <div class="form-right">

            <img th:src="@{/img/img-1.png}" alt="Ilustración pizzería">

            <div class="info-box">
                <div class="info-icon">
                    <i class="bi bi-info-circle"></i>
                </div>

                <div>
                    <h4>Importante</h4>
                    <p>
                        Asegúrate de ingresar correctamente los datos del cliente.
                        Esto ayudará a brindar un mejor servicio.
                    </p>
                </div>
            </div>

        </div>

    </section>

</main>
<div th:replace="~{fragments/alerts :: alerts}"></div>
<div th:replace="~{fragments/footer :: footer}"></div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

</body>

</html>
