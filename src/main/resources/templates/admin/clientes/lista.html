<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Clientes - La Esquina</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/navbar.css}">
    <link rel="stylesheet" th:href="@{/css/clientes.css}">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
</head>

<body>

  <div th:replace="~{fragments/navbar :: navbar}"></div>



<main class="module-page">

    <section class="module-hero">
        <div>
            <span class="module-label">Módulo administrativo</span>
            <h1>Clientes</h1>
            <p>Consulta, registra y administra los clientes de Pizzería La Esquina.</p>
        </div>

        <img th:src="@{/img/img-1.png}" alt="Ilustración pizzería">

        <a th:href="@{/admin/clientes/nuevo}" class="btn-new">
            <i class="bi bi-plus-circle-fill"></i>
            Nuevo cliente
        </a>
    </section>

    <section class="table-card">

        <div class="search-box">
            <i class="bi bi-search"></i>
            <input type="text" placeholder="Buscar cliente...">
        </div>

        <table class="table app-table">
            <thead>
            <tr>
                <th>Cliente</th>
                <th>Teléfono</th>
                <th>Correo</th>
                <th>Dirección</th>
                <th>Tipo</th>
                <th class="text-center">Acciones</th>
            </tr>
            </thead>

            <tbody>
            <tr th:each="c : ${clientes}">
                <td>
                    <div class="client-cell">
                        <div class="client-avatar"
                             th:text="${#strings.substring(c.nombreCompleto,0,1)}">
                            A
                        </div>

                        <strong th:text="${c.nombreCompleto}">
                            Ana Fernandez
                        </strong>
                    </div>
                </td>

                <td th:text="${c.telefono}"></td>
                <td th:text="${c.correo}"></td>
                <td th:text="${c.direccion}"></td>

                <td>
                    <span class="badge-type" th:text="${c.tipoCliente}">
                        SALON
                    </span>
                </td>

                <td class="text-center">
                    <a th:href="@{/admin/clientes/{id}/editar(id=${c.idCliente})}"
                       class="btn-action btn-edit">
                        <i class="bi bi-pencil-square"></i>
                        Editar
                    </a>

                    <a th:href="@{/admin/clientes/{id}/eliminar(id=${c.idCliente})}"
                       class="btn-action btn-delete btn-confirm-delete">
                       <i class="bi bi-trash3"></i>
                        Eliminar
                    </a>
                </td>
            </tr>
            </tbody>
        </table>

    </section>

</main>
<div th:replace="~{fragments/alerts :: alerts}"></div>

<div th:replace="~{fragments/footer :: footer}"></div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

</body>


</html>
