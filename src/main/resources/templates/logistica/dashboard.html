<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Panel Logística | La Esquina</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/navbar.css}">
    <link rel="stylesheet" th:href="@{/css/logistica.css}">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
</head>

<body>

<div th:replace="~{fragments/navbar :: navbar}"></div>

<main class="logistica-page">

    <section class="logistica-hero">

        <div class="logistica-content">

            <div class="logistica-title">
                <span class="logistica-icon">
                    <i class="bi bi-truck"></i>
                </span>

                <div>
                    <h1>Panel de Logística</h1>
                    <p>Monitorea el stock mínimo y gestiona el inventario de manera eficiente.</p>
                </div>
            </div>

            <div class="stock-card">
                <div class="stock-card-icon">
                    <i class="bi bi-box-seam"></i>
                </div>

                <div>
                    <h3>Alertas de stock mínimo</h3>
                    <h2 th:text="${alertasStock}">0</h2>
                    <span>No hay alertas de stock mínimo</span>
                </div>
            </div>

            <a th:href="@{/logistica/inventario}" class="btn-logistica">
                <i class="bi bi-box-seam"></i>
                Gestionar inventario
                <i class="bi bi-arrow-right"></i>
            </a>

        </div>

        <div class="logistica-image">
            <img th:src="@{/img/img-16.png}" alt="Logística e inventario">
        </div>

    </section>

</main>

<div th:replace="~{fragments/footer :: footer}"></div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
